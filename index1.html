    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成分|护肤品成分参考</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        
                // 深色模式初始化
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                if (icon) icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }
            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                if (icon) {
                    icon.classList.toggle('fa-moon-o', !isDark);
                    icon.classList.toggle('fa-sun-o', isDark);
                }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }
        
        // 退场动画跳转
        let isExiting = false;
        function pageExitAndGoHome(url) {
            if (isExiting) return;
            isExiting = true;
            document.body.classList.add('page-exit');
            document.body.classList.add('exit-bg');
            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }
        
        // 页面加载时初始化深色模式、绑定返回按钮、清理退场残留
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            
            // 重新绑定深色切换按钮（解决视觉不刷新）
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.onclick = null;
                themeToggle.addEventListener('click', () => {
                    const isDark = document.body.classList.toggle('dark');
                    const icon = themeToggle.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-moon-o', !isDark);
                        icon.classList.toggle('fa-sun-o', isDark);
                    }
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');

                    // 定义浅色和深色模式下的渐变起始色（与您之前 CSS 变量中的值一致）
                    const lightColors = {
                        basic: '#297eff',
                        antiaging: '#8b3eff',
                        bright: '#EC4899',
                        soothe: '#10B981',
                        antiox: '#6366F1',
                        default: '#6B7280'
                    };
                    const darkColors = {
                        basic: '#1e3a5f',
                        antiaging: '#4a1d6b',
                        bright: '#8b2c5e',
                        soothe: '#1f6e4a',
                        antiox: '#3c3f8a',
                        default: '#3f3f4e'
                    };
                    const colors = isDark ? darkColors : lightColors;

                    // 更新所有卡片的渐变层
                    const cards = document.querySelectorAll('.ingredient-card');
                    cards.forEach(card => {
                        const gradientLayer = card.querySelector('.gradient-layer');
                        if (!gradientLayer) return;
                        const key = card.getAttribute('data-category-key');
                        const color = colors[key] || colors.default;
                        gradientLayer.style.background = `linear-gradient(to bottom, ${color} 0%, transparent 100%)`;
                    });
                });
            }
            
            // 绑定返回按钮
            const backHomeBtn = document.getElementById('backHomeBtn');
            if (backHomeBtn) {
                backHomeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    pageExitAndGoHome('index.html');
                });
            }
            
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        
        // 从其他页面返回时也清理（pageshow 不需要重复绑定按钮）
        window.addEventListener('pageshow', () => {
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#EC4899',
                        accent: '#8B5CF6',
                        neutral: '#6B7280',
                        'neutral-light': '#F3F4F6',
                        'neutral-dark': '#374151',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <script>
    (function() {
        // 获取页面中已存在的跟随鼠标小球元素（ID 为 "cursor-dot"）
        const cursorDot = document.getElementById('cursor-dot');
        if (!cursorDot) {
        console.warn('未找到 id="cursor-dot" 的小球，控件无效');
        return;
        }

        // 读取存储的显示状态
        let dotVisible = true;
        const savedState = localStorage.getItem('cursorDotVisible');
        if (savedState !== null && savedState === 'false') {
        dotVisible = false;
        cursorDot.style.display = 'none';
        } else {
        cursorDot.style.display = '';
        }

        // 切换小球的显示/隐藏
        function setDotVisible(visible) {
        dotVisible = visible;
        cursorDot.style.display = visible ? '' : 'none';
        localStorage.setItem('cursorDotVisible', visible);
        }

        // 控件点击事件
        const widget = document.getElementById('cursorToggleWidget');
        if (widget) {
        widget.addEventListener('click', (e) => {
            e.stopPropagation();
            setDotVisible(!dotVisible);
            // 简单的视觉反馈：让眼睛图标轻微缩放
            const eyeIcon = widget.querySelector('.widget-eye i');
            if (eyeIcon) {
            eyeIcon.style.transform = 'scale(0.9)';
            setTimeout(() => { eyeIcon.style.transform = ''; }, 150);
            }
        });
        }

        // 快捷键 Ctrl+H 切换
        document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && (e.key === 'h' || e.key === 'H')) {
            e.preventDefault();
            setDotVisible(!dotVisible);
            if (widget) {
            const eyeIcon = widget.querySelector('.widget-eye i');
            if (eyeIcon) {
                eyeIcon.style.transform = 'scale(0.9)';
                setTimeout(() => { eyeIcon.style.transform = ''; }, 150);
            }
            }
        }
        });
    })();
    </script>

            function getNormalizedCategory(item) {
                const originalCat = item.category;
                if (originalCat === "眼部护理专属类") {
                    // 根据名称和功效判断：如果含抗老关键词则归入紧致抗老类，否则归入基础保湿类
                    const text = (item.name + (item.benefits || '')).toLowerCase();
                    const antiAgingKeywords = ['a醇', '视黄醇', '玻色因', '胜肽', '六胜肽', '类蛇毒肽', '芋螺肽', '蓝铜胜肽', '抗老', '紧致', '提拉', '细纹', '皱纹'];
                    if (antiAgingKeywords.some(kw => text.includes(kw))) {
                        return "紧致抗老提拉类";
                    } else {
                        return "基础保湿锁水类";
                    }
                }
                if (originalCat === "手足护理专属类") {
                    // 手足护理通常以保湿修护为主，归入基础保湿锁水类
                    return "基础保湿锁水类";
                }
                // 其他大类保持不变
                return originalCat;
            }

            const map = new Map(); // key: 成分名称

            originalData.forEach(item => {
                // 标准化大类
                const normalizedCategory = getNormalizedCategory(item);
                
                // 创建新对象
                const normalizedItem = {
                    ...item,
                    category: normalizedCategory
                };

                // 从 products 提取子类
                const subcategories = new Set();
                const productsText = normalizedItem.products || '';
                for (const [sub, keywords] of Object.entries(subcategoryKeywords)) {
                    for (const kw of keywords) {
                        if (productsText.includes(kw)) {
                            subcategories.add(sub);
                            break;
                        }
                    }
                }
                // 原眼部类强制添加“眼霜”
                if (item.category === "眼部护理专属类") {
                    subcategories.add("眼霜");
                }
                // 原手足类强制添加手霜/足霜
                if (item.category === "手足护理专属类") {
                    if (productsText.includes('手') || productsText.includes('手足')) subcategories.add("手霜");
                    if (productsText.includes('足') || productsText.includes('手足')) subcategories.add("足霜");
                    // 如果都没匹配到，至少添加一个“手霜”作为代表
                    if (!subcategories.has("手霜") && !subcategories.has("足霜")) {
                        subcategories.add("手霜");
                    }
                }
                normalizedItem.subcategories = Array.from(subcategories);

                const name = normalizedItem.name;
                if (map.has(name)) {
                    // 已存在，合并 products 和子类
                    const existing = map.get(name);
                    // 合并 products
                    const productsSet = new Set([existing.products, normalizedItem.products]);
                    existing.products = Array.from(productsSet).join('，');
                    // 合并子类
                    const mergedSubs = new Set([...existing.subcategories, ...normalizedItem.subcategories]);
                    existing.subcategories = Array.from(mergedSubs);
                    // 其他字段保持原有（category 应已统一）
                } else {
                    // 不存在，直接添加
                    map.set(name, normalizedItem);
                }
            });

            return Array.from(map.values());

                return a.localeCompare(b);

        function cgHighlightDOM(root, term) {
            if (!term) return;
            const t = String(term).toLowerCase();
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            const targets = [];
            let n;
            while ((n = walker.nextNode())) {
                if (n.parentNode && n.parentNode.nodeName !== 'MARK' &&
                    n.nodeValue.toLowerCase().includes(t)) targets.push(n);
            }
            targets.forEach(function (tn) {
                const val = tn.nodeValue, low = val.toLowerCase();
                const frag = document.createDocumentFragment();
                let i = 0, j;
                while ((j = low.indexOf(t, i)) !== -1) {
                    if (j > i) frag.appendChild(document.createTextNode(val.slice(i, j)));
                    const m = document.createElement('mark');
                    m.textContent = val.slice(j, j + term.length);
                    frag.appendChild(m);
                    i = j + term.length;
                }
                if (i < val.length) frag.appendChild(document.createTextNode(val.slice(i)));
                tn.parentNode.replaceChild(frag, tn);
            });
        }

        function heroHTML(hero) {
            let s = '<div class="cg-card cg-hero">';
            s += `<div class="cg-eyebrow">${cgEscape(hero.eyebrow)}</div>`;
            s += `<div class="cg-h1">${cgEscape(hero.title)}<br><span class="cg-h1-sub">${cgEscape(hero.titleSub)}</span></div>`;
            s += `<div class="cg-intro">${hero.intro}</div>`;
            s += '<div class="cg-legend">' + hero.legend.map(function (l) {
                return `<span class="cg-legend-item"><span class="cg-legend-ic ${l.cls}"><i class="fa ${l.ic}"></i></span>${cgEscape(l.label)}</span>`;
            }).join('') + '</div>';
            s += '</div>';
            return s;
        }

        // 表述词框（ok / ban）
        function wordsHTML(b, term) {
            let items = b.items;
            if (term) {
                items = items.filter(function (it) { return cgMatch(it.zh + ' ' + it.en, term); });
                if (!items.length) return null;
            }
            const liic = b.tone === 'ok' ? '✓' : '✕';
            let s = `<div class="cg-box ${b.tone}"><div class="cg-box-head"><span class="cg-box-title">${cgEscape(b.head)}</span><span class="cg-box-tag">${cgEscape(b.tag)}</span></div><ul class="cg-list">`;
            items.forEach(function (it) {
                s += `<li class="cg-li"><span class="cg-li-ic">${liic}</span><span class="cg-li-txt">`;
                if (it.zh) s += cgEscape(it.zh);
                if (it.zh && it.en) s += ' ';
                if (it.en) s += cgEscape(it.en);
                s += '</span></li>';
            });
            s += '</ul></div>';
            return s;
        }

        // 特别注意框
        function noteHTML(b, term) {
            let items = b.items;
            if (term) {
                items = items.filter(function (x) { return cgMatch(x, term); });
                if (!items.length) return null;
            }
            let s = `<div class="cg-box warn"><div class="cg-box-head"><span class="cg-box-title">${cgEscape(b.head)}</span><span class="cg-box-tag">${cgEscape(b.tag)}</span></div><ul class="cg-list">`;

            s += '</ul></div>';

        // 01 双卡片
        function dualHTML(b, term) {
            const all = b.cards.map(function (c) { return c.title + ' ' + c.ps.join(' '); }).join(' ') + ' ' + (b.foot || '');
            if (term && !cgMatch(all, term)) return null;
            let s = '<div class="cg-dual">';
            b.cards.forEach(function (c) {
                s += `<div class="cg-dual-card"><div class="cg-dual-title ${c.cls}"><span>${c.icon}</span>${cgEscape(c.title)}</div>`;
                c.ps.forEach(function (p) { s += `<p>${p}</p>`; });
                s += '</div>';
            });
            s += '</div>';
            if (b.foot) s += `<div class="cg-dual-foot">${cgEscape(b.foot)}</div>`;
            return s;
        }

        // 图片尺度框
        function buildImgCol(c, type, term) {
            if (!c) return null;
            let chips = (c.chips || []).slice();
            const textMatch = cgMatch(c.text, term);
            if (term) {
                if (!textMatch) chips = chips.filter(function (x) { return cgMatch(x, term); });
                if (!textMatch && !chips.length) return null;
            }
            let s = `<div class="cg-img-col ${type}"><div class="cg-img-col-title">${cgEscape(c.title)}</div><p>${cgEscape(c.text)}</p>`;
            if (chips.length) {
                s += '<div class="cg-chips">' + chips.map(function (x) {
                    return `<span class="cg-chip ${type}">${cgEscape(x)}</span>`;
                }).join('') + '</div>';
            }
            s += '</div>';
            return s;
        }
        function imagesHTML(b, term) {
            const okCol = buildImgCol(b.ok, 'ok', term);
            const noCol = buildImgCol(b.no, 'no', term);
            const footMatch = b.foot ? cgMatch(b.foot, term) : false;
            if (term && !okCol && !noCol && !footMatch) return null;
            let s = `<div class="cg-img"><div class="cg-img-title"><i class="fa fa-camera"></i>图片尺度</div><div class="cg-img-grid">`;
            if (okCol) s += okCol;
            if (noCol) s += noCol;
            s += '</div>';
            if (b.foot && (!term || footMatch)) s += `<div class="cg-img-foot">${cgEscape(b.foot)}</div>`;
            s += '</div>';
            return s;
        }

        function countriesHTML(b, term) {
            const introMatch = cgMatch(b.intro, term);

            if (term && !introMatch && !cs.length) return null;
            let s = `<div class="cg-countries-intro">${cgEscape(b.intro)}</div><div class="cg-countries">`;

            return s;

        function blockHTML(b, term) {
            if (b.t === 'words') return wordsHTML(b, term);
            if (b.t === 'note') return noteHTML(b, term);
            if (b.t === 'dual') return dualHTML(b, term);
            if (b.t === 'images') return imagesHTML(b, term);
            if (b.t === 'countries') return countriesHTML(b, term);
            return null;
        }

        function sectionHTML(sec, term) {
            let body = '', visible = false;
            sec.blocks.forEach(function (b) {
                const r = blockHTML(b, term);
                if (r) { body += r; visible = true; }
            });
            const titleMatch = cgMatch(sec.title + ' ' + sec.sub, term);
            if (term && !visible && !titleMatch) return null;
            if (term && titleMatch && !visible) {
                body = sec.blocks.map(function (b) { return blockHTML(b, null); }).join('');
            }
            return `<div class="cg-card cg-section" id="cg-sec-${sec.no}"><div class="cg-sec-head"><span class="cg-sec-num">${sec.no}</span><div><div class="cg-sec-title">${cgEscape(sec.title)}</div><div class="cg-sec-sub">${cgEscape(sec.sub)}</div></div></div><div class="cg-sec-body">${body}</div></div>`;

                filtered = filtered.filter(ingredient => ingredient.category === currentCategory);

                    ingredient.name.toLowerCase().includes(searchLower) ||

                    (ingredient.scientificName && ingredient.scientificName.toLowerCase().includes(searchLower))

            // 根据当前分类决定渲染方式
            if (currentCategory === 'all') {

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 显示圆点
            if (cursorDot.style.opacity === '0') {
                cursorDot.style.opacity = '1';

            // 标记鼠标正在移动，清除之前的定时器

        // 动画循环：让圆点平滑跟随

            // 计算与目标位置的差值

            // 根据鼠标是否移动调整跟随速度
            if (isMouseMoving) {
                // 移动时：快速跟随（但保留一点延迟感）

                dotY += diffY * 0.15;

                // 停止时：缓慢回到指针位置
                dotX += diffX * 0.1;
                dotY += diffY * 0.1;

            // 应用位置
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';

                    borderColor = 'border-red-200';
                    textColor = 'text-red-700';
                    iconColor = 'text-red-500';
                } else if (ann.type === 'warning') {
                    bgColor = 'bg-yellow-50';
                    borderColor = 'border-yellow-200';
                    textColor = 'text-yellow-700';
                    iconColor = 'text-yellow-500';
                } else {
                    bgColor = 'bg-blue-50';
                    borderColor = 'border-blue-200';
                    textColor = 'text-blue-700';
                    iconColor = 'text-blue-500';
                }
                
                // 创建公告容器
                var annDiv = document.createElement('div');
                annDiv.className = 'mb-3 rounded-lg border ' + borderColor + ' ' + bgColor;
                annDiv.id = 'announcement-' + ann.id;
                
                // 创建标题按钮
                var toggleBtn = document.createElement('button');
                toggleBtn.className = 'w-full py-2.5 px-4 flex items-center justify-between transition-all hover:bg-opacity-80';
                toggleBtn.innerHTML = 
                    '<div class="flex items-center gap-2">' +
                        '<i class="fa ' + ann.icon + ' ' + iconColor + ' text-lg"></i>' +
                        '<span class="text-sm font-semibold ' + textColor + '">' + ann.title + '</span>' +
                        (ann.date ? '<span class="text-xs ' + textColor + ' opacity-70 ml-2">' + ann.date + '</span>' : '') +
                    '</div>' +
                    '<i class="fa fa-chevron-down text-xs transition-transform duration-300 ' + textColor + '" id="ann-arrow-' + ann.id + '"></i>';
                
                // 创建内容面板
                var contentDiv = document.createElement('div');
                contentDiv.className = 'px-4 pb-4 text-sm ' + textColor + ' hidden';
                contentDiv.id = 'ann-content-' + ann.id;
                contentDiv.innerHTML = ann.content;
                
                // 绑定点击事件
                (function(contentId, arrowId) {
                    toggleBtn.addEventListener('click', function() {
                        var content = document.getElementById(contentId);
                        var arrow = document.getElementById(arrowId);
                        if (content.classList.contains('hidden')) {
                            content.classList.remove('hidden');
                            if (arrow) arrow.style.transform = 'rotate(180deg)';
                        } else {
                            content.classList.add('hidden');
                            if (arrow) arrow.style.transform = 'rotate(0deg)';
                        }
                    });
                })('ann-content-' + ann.id, 'ann-arrow-' + ann.id);
                
                annDiv.appendChild(toggleBtn);
                annDiv.appendChild(contentDiv);
                listEl.appendChild(annDiv);
            }
        }
        
        // 给肽类成分卡片加警告标识
        function addPeptideBadges() {
            var cards = document.querySelectorAll('.ingredient-card');
            for (var i = 0; i < cards.length; i++) {
                var card = cards[i];
                // 删除旧标识
                var oldBadge = card.querySelector('.peptide-badge');
                if (oldBadge) oldBadge.remove();
                
                // 获取成分名称
                var nameEl = card.querySelector('h3');
                if (!nameEl) continue;
                var name = nameEl.textContent || '';
                
                // 只给名称含"肽"或"胜肽"的成分加标识
                if (name.indexOf('肽') !== -1 || name.indexOf('胜肽') !== -1) {
                    var badge = document.createElement('div');
                    badge.className = 'peptide-badge absolute top-2 right-2 z-30';
                    badge.innerHTML = '<i class="fa fa-exclamation-triangle text-red-500 text-xl" title="肽类成分高危管控"></i>';
                    card.style.position = 'relative';
                    card.appendChild(badge);
                }
            }
        }
        
        // 控制公告显示隐藏
        function updateAnnouncementVisibility() {
            var widget = document.getElementById('announcement-widget');
            if (!widget) return;
            if (currentCategory === '违规词参考') {
                widget.classList.add('hidden');
            } else {
                widget.classList.remove('hidden');
                setTimeout(addPeptideBadges, 100);
            }
        }
        
        // 包装原filterIngredients函数
        var originalFilterAnnouncement = filterIngredients;
        filterIngredients = function() {
            originalFilterAnnouncement.apply(this, arguments);
            updateAnnouncementVisibility();
        };
        
        // 初始化页面
        renderIngredients(mergedIngredientsData);
        // 初始化公告系统
        renderAnnouncements();
        setTimeout(addPeptideBadges, 200);
        updateAnnouncementVisibility();
        // 初始给肽类卡片加警告标识
        setTimeout(addPeptideBadges, 200);
        updatePeptideWarningVisibility();
        
        // 绑定导航栏气泡按钮事件（需要等DOM加载完成）
        setTimeout(() => {
            const ignoreBtn = document.getElementById('ignoreNavTipBtn');
            const goBtn = document.getElementById('goToSourceNavBtn');
            const bubble = document.getElementById('prohibitedTipBubble');
            
            if (ignoreBtn) {
                ignoreBtn.addEventListener('click', function() {
                    if (bubble) bubble.classList.add('hidden');
                });
            }
            if (goBtn) {
                goBtn.addEventListener('click', function() {
                    window.open('https://seller.kuajingmaihuo.com/questionnaire?surveyId=19802919030', '_blank', 'noopener,noreferrer');
                });
            }
        }, 100);
    </script>
