    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成分|护肤品成分参考</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        
                // 深色模式初始化
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                if (icon) icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }
            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                if (icon) {
                    icon.classList.toggle('fa-moon-o', !isDark);
                    icon.classList.toggle('fa-sun-o', isDark);
                }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }
        
        // 退场动画跳转
        let isExiting = false;
        function pageExitAndGoHome(url) {
            if (isExiting) return;
            isExiting = true;
            document.body.classList.add('page-exit');
            document.body.classList.add('exit-bg');
            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }
        
        // 页面加载时初始化深色模式、绑定返回按钮、清理退场残留
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            
            // 重新绑定深色切换按钮（解决视觉不刷新）
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.onclick = null;
                themeToggle.addEventListener('click', () => {
                    const isDark = document.body.classList.toggle('dark');
                    const icon = themeToggle.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-moon-o', !isDark);
                        icon.classList.toggle('fa-sun-o', isDark);
                    }
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');

                    // 定义浅色和深色模式下的渐变起始色（与您之前 CSS 变量中的值一致）
                    const lightColors = {
                        basic: '#297eff',
                        antiaging: '#8b3eff',
                        bright: '#EC4899',
                        soothe: '#10B981',
                        antiox: '#6366F1',
                        default: '#6B7280'
                    };
                    const darkColors = {
                        basic: '#1e3a5f',
                        antiaging: '#4a1d6b',
                        bright: '#8b2c5e',
                        soothe: '#1f6e4a',
                        antiox: '#3c3f8a',
                        default: '#3f3f4e'
                    };
                    const colors = isDark ? darkColors : lightColors;

                    // 更新所有卡片的渐变层
                    const cards = document.querySelectorAll('.ingredient-card');
                    cards.forEach(card => {
                        const gradientLayer = card.querySelector('.gradient-layer');
                        if (!gradientLayer) return;
                        const key = card.getAttribute('data-category-key');
                        const color = colors[key] || colors.default;
                        gradientLayer.style.background = `linear-gradient(to bottom, ${color} 0%, transparent 100%)`;
                    });
                });
            }
            
            // 绑定返回按钮
            const backHomeBtn = document.getElementById('backHomeBtn');
            if (backHomeBtn) {
                backHomeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    pageExitAndGoHome('index.html');
                });
            }
            
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        
        // 从其他页面返回时也清理（pageshow 不需要重复绑定按钮）
        window.addEventListener('pageshow', () => {
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#EC4899',
                        accent: '#8B5CF6',
                        neutral: '#6B7280',
                        'neutral-light': '#F3F4F6',
                        'neutral-dark': '#374151',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

                if (originalCat === "眼部护理专属类") {
                    // 根据名称和功效判断：如果含抗老关键词则归入紧致抗老类，否则归入基础保湿类
                    const text = (item.name + (item.benefits || '')).toLowerCase();
                    const antiAgingKeywords = ['a醇', '视黄醇', '玻色因', '胜肽', '六胜肽', '类蛇毒肽', '芋螺肽', '蓝铜胜肽', '抗老', '紧致', '提拉', '细纹', '皱纹'];

                // 创建新对象
                const normalizedItem = {
                    ...item,
                    category: normalizedCategory
                };

                // 从 products 提取子类
                const subcategories = new Set();
                const productsText = normalizedItem.products || '';
                for (const [sub, keywords] of Object.entries(subcategoryKeywords)) {

                            break;
                        }
                    }

                // 原眼部类强制添加“眼霜”

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

        // 按子类分组渲染（用于大类页面）
        function renderCategoryPage(ingredients, categoryName) {
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.className = 'flex flex-col gap-6';
            
            const quickNav = document.getElementById('quick-nav');
            if (quickNav) quickNav.innerHTML = '';

            if (ingredients.length === 0) {
                ingredientsContainer.innerHTML = `
                    <div class="text-center py-12 w-full">
                        <i class="fa fa-search text-4xl text-gray-400 mb-4"></i>
                        <p class="text-lg text-gray-500">未找到匹配的成分，请尝试其他搜索词或进行反馈</p>
                    </div>
                `;
                return;
            }


            // 收集所有子类
            const allSubs = new Set();
            ingredients.forEach(ing => {
                ing.subcategories.forEach(sub => allSubs.add(sub));
            });

            // 自定义排序优先级
            const prioritySubs = ['面霜', '颈霜', '眼霜', '精华', '手霜', '足霜'];
            const subsArray = Array.from(allSubs);
            const sortedSubs = subsArray.sort((a, b) => {
                const aIndex = prioritySubs.indexOf(a);
                const bIndex = prioritySubs.indexOf(b);
                if (aIndex !== -1 && bIndex !== -1) {
                    return aIndex - bIndex;
                }
                if (aIndex !== -1) return -1;
                if (bIndex !== -1) return 1;
                return a.localeCompare(b);
            });

            // 为每个子类创建一个区块
            sortedSubs.forEach(sub => {
                const subIngredients = ingredients.filter(ing => ing.subcategories.includes(sub));
                if (subIngredients.length === 0) return;

                // 子类标题
                const section = document.createElement('div');
                section.id = `sub-${sub.replace(/\s+/g, '-')}`;
                section.className = 'mb-10';
                section.innerHTML = `<h3 class="text-xl font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">${sub}</h3>`;
                
                // 生成胶囊按钮
                const capsule = document.createElement('button');
                capsule.className = 'capsule-btn';
                capsule.textContent = sub;
                capsule.setAttribute('data-target', `sub-${sub.replace(/\s+/g, '-')}`);
                capsule.addEventListener('click', () => {
                    const target = document.getElementById(`sub-${sub.replace(/\s+/g, '-')}`);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                if (quickNav) quickNav.appendChild(capsule);

                // 根据屏幕宽度确定列数（与 renderIngredients 一致）
                const columnCount = window.innerWidth < 640 ? 1 : (window.innerWidth < 1024 ? 2 : 3);

                // 创建列容器数组
                const columns = [];
                for (let i = 0; i < columnCount; i++) {
                    const col = document.createElement('div');
                    col.className = 'flex-1 flex flex-col gap-6';
                    columns.push(col);
                }

                // 将卡片按顺序分配到各列
                subIngredients.forEach((ing, index) => {
                    const colIndex = index % columnCount;
                    const card = createCard(ing);
                    columns[colIndex].appendChild(card);
                });

                // 将列容器放入一个 flex 行容器中，再添加到 section
                const rowContainer = document.createElement('div');
                rowContainer.className = 'flex flex-col sm:flex-row gap-6 items-start';
                columns.forEach(col => rowContainer.appendChild(col));

                section.appendChild(rowContainer);
                ingredientsContainer.appendChild(section);
            });
            
            // 添加返回顶部胶囊
            if (quickNav) {
                appendBackToTopCapsule();
            }
        }

        // 抽取卡片创建逻辑，保持代码清晰

                    <!-- 子类标签区域 -->

                    <!-- 名称区域 -->

                    </div>
                    
                    <!-- 详情区域 -->
                    <div class="ingredient-details overflow-hidden transition-all duration-300 max-h-0 opacity-0">
                        <div class="space-y-4 pt-4 border-t border-gray-100">
                            <div>
                                <h4 class="text-sm font-semibold text-gray-700 mb-1">核心合规功效</h4>
                                <p class="text-gray-600">${ingredient.benefits}</p>
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold text-gray-700 mb-1">TEMU适配产品品类</h4>
                                <p class="text-gray-600">${ingredient.products}</p>
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold text-gray-700 mb-1">风险与合规提示</h4>
                                <p class="text-gray-600">${ingredient.risks}</p>

                    <!-- 展开/收起按钮 -->
                    <button class="toggle-details mt-4 text-primary hover:text-primary/80 flex items-center justify-center transition-all-300 relative z-20 w-full">

            // 添加展开/收起功能
            const toggleButton = card.querySelector('.toggle-details');
            const details = card.querySelector('.ingredient-details');
            const toggleText = card.querySelector('.toggle-text');

                if (details.style.maxHeight === '0px' || details.style.maxHeight === '') {

        // ===== 渲染：涉药违规自查指南（违规词参考页）=====
        function cgEscape(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function cgMatch(text, term) {
            if (!term) return true;
            return String(text).toLowerCase().includes(String(term).toLowerCase());
        }
        // 在已插入的 DOM 上高亮搜索词（保留 <u>/<b> 等标签）
        function cgHighlightDOM(root, term) {
            if (!term) return;
            const t = String(term).toLowerCase();
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            const targets = [];
            let n;
            while ((n = walker.nextNode())) {
                if (n.parentNode && n.parentNode.nodeName !== 'MARK' &&
                    n.nodeValue.toLowerCase().includes(t)) targets.push(n);
            }
            targets.forEach(function (tn) {
                const val = tn.nodeValue, low = val.toLowerCase();
                const frag = document.createDocumentFragment();
                let i = 0, j;
                while ((j = low.indexOf(t, i)) !== -1) {
                    if (j > i) frag.appendChild(document.createTextNode(val.slice(i, j)));
                    const m = document.createElement('mark');
                    m.textContent = val.slice(j, j + term.length);
                    frag.appendChild(m);
                    i = j + term.length;
                }
                if (i < val.length) frag.appendChild(document.createTextNode(val.slice(i)));
                tn.parentNode.replaceChild(frag, tn);
            });
        }

        // Hero
        function heroHTML(hero) {
            let s = '<div class="cg-card cg-hero">';
            s += `<div class="cg-eyebrow">${cgEscape(hero.eyebrow)}</div>`;
            s += `<div class="cg-h1">${cgEscape(hero.title)}<br><span class="cg-h1-sub">${cgEscape(hero.titleSub)}</span></div>`;
            s += `<div class="cg-intro">${hero.intro}</div>`;
            s += '<div class="cg-legend">' + hero.legend.map(function (l) {
                return `<span class="cg-legend-item"><span class="cg-legend-ic ${l.cls}"><i class="fa ${l.ic}"></i></span>${cgEscape(l.label)}</span>`;
            }).join('') + '</div>';
            s += '</div>';
            return s;
        }

        // 表述词框（ok / ban）
        function wordsHTML(b, term) {
            let items = b.items;
            if (term) {
                items = items.filter(function (it) { return cgMatch(it.zh + ' ' + it.en, term); });
                if (!items.length) return null;
            }
            const liic = b.tone === 'ok' ? '✓' : '✕';
            let s = `<div class="cg-box ${b.tone}"><div class="cg-box-head"><span class="cg-box-title">${cgEscape(b.head)}</span><span class="cg-box-tag">${cgEscape(b.tag)}</span></div><ul class="cg-list">`;
            items.forEach(function (it) {
                s += `<li class="cg-li"><span class="cg-li-ic">${liic}</span><span class="cg-li-txt">`;
                if (it.zh) s += cgEscape(it.zh);
                if (it.zh && it.en) s += ' ';
                if (it.en) s += cgEscape(it.en);
                s += '</span></li>';
            });
            s += '</ul></div>';
            return s;
        }

        // 特别注意框
        function noteHTML(b, term) {
            let items = b.items;
            if (term) {
                items = items.filter(function (x) { return cgMatch(x, term); });
                if (!items.length) return null;
            }
            let s = `<div class="cg-box warn"><div class="cg-box-head"><span class="cg-box-title">${cgEscape(b.head)}</span><span class="cg-box-tag">${cgEscape(b.tag)}</span></div><ul class="cg-list">`;
            items.forEach(function (x) {
                s += `<li class="cg-li"><span class="cg-li-ic">!</span><span class="cg-li-txt">${cgEscape(x)}</span></li>`;
            });
            s += '</ul></div>';
            return s;
        }

        // 01 双卡片
        function dualHTML(b, term) {
            const all = b.cards.map(function (c) { return c.title + ' ' + c.ps.join(' '); }).join(' ') + ' ' + (b.foot || '');
            if (term && !cgMatch(all, term)) return null;
            let s = '<div class="cg-dual">';
            b.cards.forEach(function (c) {
                s += `<div class="cg-dual-card"><div class="cg-dual-title ${c.cls}"><span>${c.icon}</span>${cgEscape(c.title)}</div>`;
                c.ps.forEach(function (p) { s += `<p>${p}</p>`; });
                s += '</div>';
            });
            s += '</div>';
            if (b.foot) s += `<div class="cg-dual-foot">${cgEscape(b.foot)}</div>`;
            return s;
        }

        // 图片尺度框
        function buildImgCol(c, type, term) {
            if (!c) return null;
            let imgs = (c.imgs || []).slice();
            const textMatch = cgMatch(c.text, term) || cgMatch(c.title, term);
            if (term) {
                imgs = imgs.filter(function (x) { return cgMatch(x.cap, term); });
                if (!textMatch && !imgs.length) return null;
            }
            let s = `<div class="cg-img-col ${type}"><div class="cg-img-col-title">${cgEscape(c.title)}</div><p>${cgEscape(c.text)}</p>`;
            if (imgs.length) {
                const mark = type === 'ok' ? '✓' : '✕';
                s += '<div class="cg-imgs">' + imgs.map(function (x) {
                    const wide = x.wide ? ' wide' : '';
                    const url = cgEscape(x.src);
                    const cap = cgEscape(x.cap);
                    return `<figure class="cg-imgcard ${type}${wide}" data-full="${url}" data-cap="${cap}" title="点击查看高清大图">` +
                        `<img src="${url}" alt="${cap}" loading="lazy">` +
                        `<figcaption><span class="cg-ic-mark">${mark}</span><span>${cap}</span></figcaption></figure>`;
                }).join('') + '</div>';
            }
            s += '</div>';
            return s;
        }
        // 祛痘：三张恶心图竖排（无空合规框）
        function verticalImagesHTML(b, term) {
            const col = b.no;
            let imgs = (col.imgs || []).slice();
            const introMatch = cgMatch(b.intro, term);
            const titleMatch = cgMatch(col.title, term);
            if (term) {
                imgs = imgs.filter(function (x) { return cgMatch(x.cap, term); });
                if (!introMatch && !titleMatch && !imgs.length) return null;
            }
            let s = `<div class="cg-img vertical"><div class="cg-img-title"><i class="fa fa-camera"></i>图片尺度</div>`;
            if (b.intro && (!term || introMatch)) s += `<p class="cg-vintro">${cgEscape(b.intro)}</p>`;
            s += `<div class="cg-vtitle"><span>⚠️</span><span>${cgEscape(col.title)}</span></div>`;
            s += '<div class="cg-vstack">' + imgs.map(function (x) {
                const url = cgEscape(x.src);
                const cap = cgEscape(x.cap);
                return `<figure class="cg-vcard" data-full="${url}" data-cap="${cap}" title="点击查看高清大图">` +
                    `<img src="${url}" alt="${cap}" loading="lazy">` +
                    `<figcaption><span class="cg-ic-mark">✕</span><span>${cap}</span></figcaption></figure>`;
            }).join('') + '</div></div>';
            return s;
        }
        function imagesHTML(b, term) {
            const okCol = buildImgCol(b.ok, 'ok', term);
            const noCol = buildImgCol(b.no, 'no', term);
            const footMatch = b.foot ? cgMatch(b.foot, term) : false;
            if (term && !okCol && !noCol && !footMatch) return null;
            const single = (!okCol || !noCol) ? ' single' : '';
            let s = `<div class="cg-img"><div class="cg-img-title"><i class="fa fa-camera"></i>图片尺度</div><div class="cg-img-grid${single}">`;
            if (okCol) s += okCol;
            if (noCol) s += noCol;
            s += '</div>';
            if (b.foot && (!term || footMatch)) s += `<div class="cg-img-foot">${cgEscape(b.foot)}</div>`;
            s += '</div>';
            return s;
        }

        // 国家/地区
        function countriesHTML(b, term) {
            const introMatch = cgMatch(b.intro, term);
            let cs = b.countries;
            if (term) cs = cs.filter(function (x) { return cgMatch(x, term); });
            if (term && !introMatch && !cs.length) return null;
            let s = `<div class="cg-countries-intro">${cgEscape(b.intro)}</div><div class="cg-countries">`;
            s += cs.map(function (x) { return `<span class="cg-country">${cgEscape(x)}</span>`; }).join('');
            s += '</div>';
            return s;
        }

        function blockHTML(b, term) {
            if (b.t === 'words') return wordsHTML(b, term);
            if (b.t === 'note') return noteHTML(b, term);
            if (b.t === 'dual') return dualHTML(b, term);
            if (b.t === 'images') return b.vertical ? verticalImagesHTML(b, term) : imagesHTML(b, term);
            if (b.t === 'countries') return countriesHTML(b, term);
            return null;
        }

        function sectionHTML(sec, term) {
            let body = '', visible = false;
            sec.blocks.forEach(function (b) {
                const r = blockHTML(b, term);
                if (r) { body += r; visible = true; }
            });
            const titleMatch = cgMatch(sec.title + ' ' + sec.sub, term);
            if (term && !visible && !titleMatch) return null;
            if (term && titleMatch && !visible) {
                body = sec.blocks.map(function (b) { return blockHTML(b, null); }).join('');
            }
            return `<div class="cg-card cg-section" id="cg-sec-${sec.no}"><div class="cg-sec-head"><span class="cg-sec-num">${sec.no}</span><div><div class="cg-sec-title">${cgEscape(sec.title)}</div><div class="cg-sec-sub">${cgEscape(sec.sub)}</div></div></div><div class="cg-sec-body">${body}</div></div>`;
        }

        function finalHTML(fin, term) {
            const all = fin.title + ' ' + fin.text + ' ' + fin.sign + ' ' + fin.src;
            if (term && !cgMatch(all, term)) return '';
            return `<div class="cg-card cg-final"><div class="cg-final-title">${cgEscape(fin.title)}</div><p>${cgEscape(fin.text)}</p><div class="cg-final-sign">${cgEscape(fin.sign)}</div><div class="cg-src">${cgEscape(fin.src)}</div></div>`;
        }

        /* ===== 右侧固定胶囊导航舱控制（仅违规词参考页）===== */
        const cgDock = document.getElementById('cg-nav-dock');
        const cgCapsulesBox = document.getElementById('cg-capsules');
        const cgDockToggle = document.getElementById('cg-dock-toggle');

        // 每个分区：常态显示两字短标签，悬停向右（内容方向）展开补充文字
        const cgDockLabels = {
            '01': { short: '定义', ext: '化妆品 vs 药品' },
            '02': { short: '抗衰', ext: '祛皱 · 修复' },
            '03': { short: '美白', ext: '祛斑' },
            '04': { short: '祛痘', ext: '去角质 · 黑头 · 毛孔' },
            '05': { short: '防晒', ext: '美加澳新管控' },
            '06': { short: '美黑', ext: '免晒美黑' },
            '07': { short: '站点', ext: '特殊可用' },
            '08': { short: '其他', ext: '涉药词' }
        };

        let cgCapsHidden = localStorage.getItem('cgCapsHidden') === 'true';

        function cgBuildCapsules() {
            if (!cgCapsulesBox) return;
            cgCapsulesBox.innerHTML = '';
            complianceGuide.sections.forEach(function (sec, idx) {
                const lb = cgDockLabels[sec.no];
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'cg-cap';
                b.style.animationDelay = (0.06 * idx + 0.05) + 's';
                b.innerHTML =
                    '<span class="cg-cap-short">' + cgEscape(lb.short) + '</span>' +
                    '<span class="cg-cap-ext">· ' + cgEscape(lb.ext) + '</span>';
                b.addEventListener('click', function () {
                    const go = function () {
                        const t = document.getElementById('cg-sec-' + sec.no);
                        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    };
                    if (currentSearchTerm) {
                        searchInput.value = '';
                        currentSearchTerm = '';
                        renderComplianceGuide('');
                        setTimeout(go, 140);
                    } else { go(); }
                });
                cgCapsulesBox.appendChild(b);
            });
        }

        function cgSetToggleIcon() {
            const ic = cgDockToggle ? cgDockToggle.querySelector('.cg-tog-btn i') : null;
            if (ic) ic.className = cgCapsHidden ? 'fa fa-eye' : 'fa fa-eye-slash';
        }
        function cgApplyCapsHidden() {
            if (!cgDock) return;
            cgDock.classList.toggle('caps-hidden', cgCapsHidden);
            cgSetToggleIcon();
        }
        function cgDockShow() {
            if (!cgDock) return;
            cgDock.style.display = 'flex';
            cgDock.setAttribute('aria-hidden', 'false');
            cgApplyCapsHidden();
            cgDock.classList.remove('in');
            void cgDock.offsetWidth;          // 重新触发从右侧弹入动画
            cgDock.classList.add('in');
        }
        function cgDockHide() {
            if (!cgDock) return;
            cgDock.classList.remove('in');
            cgDock.style.display = 'none';
            cgDock.setAttribute('aria-hidden', 'true');
        }

        if (cgDockToggle) {
            cgDockToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                cgCapsHidden = !cgCapsHidden;
                localStorage.setItem('cgCapsHidden', cgCapsHidden ? 'true' : 'false');
                cgApplyCapsHidden();
            });
        }

        if (complianceGuide) cgBuildCapsules(); // 数据加载后再构建（启动流程中会补调用）

        /* ===== 全屏灯箱：点击示例图查看高清大图 ===== */
        const cgLb = document.getElementById('cg-lightbox');
        const cgLbImg = cgLb.querySelector('.cg-lb-img');
        const cgLbCap = cgLb.querySelector('.cg-lb-cap');
        function cgLbOpen(src, cap) {
            cgLbImg.src = src;
            cgLbCap.textContent = cap || '';
            cgLb.classList.add('open');
            cgLb.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }
        function cgLbClose() {
            cgLb.classList.remove('open');
            cgLb.setAttribute('aria-hidden', 'true');
            cgLbImg.src = '';
            document.body.style.overflow = '';
        }
        document.addEventListener('click', function (e) {
            const card = e.target.closest ? e.target.closest('.cg-imgcard, .cg-vcard') : null;
            if (card) {
                e.preventDefault();
                cgLbOpen(card.getAttribute('data-full'), card.getAttribute('data-cap'));
                return;
            }
            if (e.target.closest && e.target.closest('.cg-lb-close')) { cgLbClose(); return; }
            if (e.target === cgLb) cgLbClose();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) cgLbClose();
        });

        function renderComplianceGuide(term) {
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.className = 'flex flex-col';
            const qn = document.getElementById('quick-nav');
            if (qn) qn.innerHTML = '';

            const g = complianceGuide;
            let bodyHTMLstr = '', secCount = 0;
            g.sections.forEach(function (sec) {
                const r = sectionHTML(sec, term);
                if (r) { bodyHTMLstr += r; secCount++; }
            });
            const fHTML = finalHTML(g.final, term);

            const heroText = [g.hero.eyebrow, g.hero.title, g.hero.titleSub, g.hero.intro,
            g.hero.legend.map(function (l) { return l.label; }).join(' ')].join(' ');
            const finalText = g.final.title + ' ' + g.final.text + ' ' + g.final.sign + ' ' + g.final.src;
            const anyMatch = secCount > 0 || cgMatch(heroText, term) || cgMatch(finalText, term);

            if (term && !anyMatch) {
                ingredientsContainer.innerHTML = '<div class="cg"><div class="cg-card cg-empty"><i class="fa fa-search"></i><p>未找到匹配的违规词 / 表述，请尝试其他关键词</p></div></div>';
                return;
            }

            let html = '<div class="cg">' + heroHTML(g.hero) + bodyHTMLstr + fHTML + '</div>';
            ingredientsContainer.innerHTML = html;
            if (term) cgHighlightDOM(ingredientsContainer, term);
        }

        // 渲染游戏列表
        function renderGames(games) {
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.className = 'flex flex-col gap-4 w-full';
            
            const quickNav = document.getElementById('quick-nav');
            if (quickNav) quickNav.innerHTML = '';
            
            if (games.length === 0) {
                ingredientsContainer.innerHTML = `
                    <div class="text-center py-12 w-full">
                        <i class="fa fa-gamepad text-4xl text-gray-400 mb-4"></i>
                        <p class="text-lg text-gray-500">暂无游戏，敬请期待</p>
                    </div>
                `;
                return;
            }
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-soft hover:shadow-hover transition-all-300 p-6 flex flex-col md:flex-row items-start gap-5 w-full';
                card.innerHTML = `
                    <div class="flex-shrink-0 w-16 h-16 rounded-2xl bg-gradient-to-br ${game.color} flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="fa ${game.icon}"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${game.name}</h3>
                        <p class="text-gray-600 mb-4">${game.description}</p>
                        <button class="play-game-btn inline-flex items-center gap-2 bg-gradient-to-r ${game.color} text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-md hover:shadow-lg transition-all duration-200 transform hover:scale-105" data-game-url="${game.file}">
                            <i class="fa fa-play"></i>
                            <span>开始游戏</span>
                            <i class="fa fa-external-link ml-1 text-xs opacity-75"></i>
                        </button>
                    </div>
                `;
                ingredientsContainer.appendChild(card);
            });
            
            // 绑定开始游戏按钮事件
            document.querySelectorAll('.play-game-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const url = this.dataset.gameUrl;
                    window.open(url, '_blank', 'noopener,noreferrer');
                });
            });
        }

        // 筛选成分
        function filterIngredients() {
            // 违规词参考：渲染涉药违规自查指南
            if (currentCategory === '违规词参考') {
                renderComplianceGuide(currentSearchTerm || '');
                return;
            }
            
            if (currentCategory === 'game') {
                renderGames(gamesData);
                return;
            }
            
            // 使用合并后的数据
            let filtered = mergedIngredientsData;
            
            // 如果不是“全部”，按大类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(ingredient => ingredient.category === currentCategory);
            }
            
            // 按搜索词筛选（支持名称、英文名、学名）
            if (currentSearchTerm) {
                const searchLower = currentSearchTerm.toLowerCase();
                filtered = filtered.filter(ingredient => 
                    ingredient.name.toLowerCase().includes(searchLower) || 
                    (ingredient.englishName && ingredient.englishName.toLowerCase().includes(searchLower)) || 
                    (ingredient.scientificName && ingredient.scientificName.toLowerCase().includes(searchLower))
                );
            }
            
            // 根据当前分类决定渲染方式
            if (currentCategory === 'all') {
                // 全部成分页面：使用多列布局，卡片带子类标签
                renderIngredients(filtered);
            } else {
                // 大类页面：按子类分组渲染
                renderCategoryPage(filtered, currentCategory);
            }
        }

        // 搜索功能
        function handleSearch() {
            currentSearchTerm = searchInput.value.trim();
            filterIngredients();
        }

        // 分类筛选功能
        function handleCategoryFilter(category) {
            currentCategory = category;
            
            categoryButtons.forEach(btn => {
                const isActive = btn.dataset.category === category;
                // 移除所有可能的状态类
                btn.classList.remove('bg-gradient-primary', 'text-white', 'bg-white', 'text-neutral-dark');
                
                if (isActive) {
                    // 激活状态：默认用 primary 渐变，游戏按钮用紫色渐变以示区分
                    if (category === 'game') {
                        btn.classList.add('bg-gradient-to-r', 'from-purple-500', 'to-purple-600', 'text-white');
                    } else {
                        btn.classList.add('bg-gradient-primary', 'text-white');
                    }
                } else {
                    btn.classList.add('bg-white', 'text-neutral-dark');
                }
            });
            
            // 控制导航栏气泡显示/隐藏
            const navTipBubble = document.getElementById('prohibitedTipBubble');
            if (navTipBubble) {
                if (category === '违规词参考') {
                    navTipBubble.classList.remove('hidden');
                } else {
                    navTipBubble.classList.add('hidden');
                }
            }

            // 控制右侧固定胶囊导航舱：仅违规词参考页出现
            if (category === '违规词参考') {
                cgDockShow();
            } else {
                cgDockHide();
            }

            filterIngredients();
        }

        // ========== 搜索框展开/收起逻辑 ==========
        const searchContainer = document.getElementById('search-container');

        // 检查搜索框是否已展开
        function isSearchExpanded() {
            return searchInput.classList.contains('w-64') || searchInput.classList.contains('w-full');
        }

        // 展开搜索框
        function expandSearch() {
            searchInput.classList.remove('w-0', 'opacity-0');
            searchInput.classList.add('opacity-100', 'px-4');
            if (window.innerWidth < 768) {
                searchInput.classList.add('w-full');
                searchInput.classList.remove('w-64');
            } else {
                searchInput.classList.add('w-64');
                searchInput.classList.remove('w-full');
            }
            searchButton.classList.add('hidden'); // 隐藏放大镜按钮
            searchInput.focus();
        }

        // 收起搜索框（仅当内容为空时）
        function collapseSearch() {
            if (searchInput.value.trim() === '') {
                // 先收起搜索框
                searchInput.classList.remove('w-64', 'w-full', 'opacity-100', 'px-4');
                searchInput.classList.add('w-0', 'opacity-0');
                
                // 添加延迟，等搜索框完全收回收起后再显示放大镜按钮
                setTimeout(() => {
                    searchButton.classList.remove('hidden'); // 显示放大镜按钮
                }, 300); // 延迟时间与 CSS transition 时间一致
            }
        }

        // 自定义搜索按钮点击事件
        searchButton.addEventListener('click', function(e) {
            e.preventDefault();
            if (!isSearchExpanded()) {
                expandSearch();
            } else {
                // 已展开则执行搜索
                handleSearch();
            }
        });

        // 输入框失去焦点时尝试收起
        searchInput.addEventListener('blur', function() {
            collapseSearch();
        });

        // 实时搜索：输入内容变化立即筛选
        searchInput.addEventListener('input', function() {
            currentSearchTerm = searchInput.value.trim();
            filterIngredients();
        });

        // 窗口大小变化时调整展开宽度
        window.addEventListener('resize', function() {
            if (isSearchExpanded()) {
                if (window.innerWidth < 768) {
                    searchInput.classList.remove('w-64');
                    searchInput.classList.add('w-full');
                } else {
                    searchInput.classList.remove('w-full');
                    searchInput.classList.add('w-64');
                }
            }
        });
        // ========== 结束 ==========

        // 事件监听
        // searchButton.addEventListener('click', handleSearch); // 注释掉原有事件，使用新的展开/收起逻辑
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                handleCategoryFilter(btn.dataset.category);
            });
        });

        // 窗口大小变化时重新渲染（防抖处理）
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                filterIngredients(); // 重新触发筛选，自动重新布局
            }, 200);
        });

        // 返回顶部按钮功能
        const backToTop = document.getElementById('back-to-top');

        // 监听滚动事件，显示/隐藏按钮
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) { // 滚动超过300px时显示
                backToTop.classList.remove('opacity-0', 'invisible');
                backToTop.classList.add('opacity-100', 'visible');
            } else {
                backToTop.classList.add('opacity-0', 'invisible');
                backToTop.classList.remove('opacity-100', 'visible');
            }
        });

        // 点击按钮平滑滚动到顶部
        backToTop.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // 跟随鼠标的小圆点
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;
        let isMouseMoving = false;
        let timeoutId;

        // 监听鼠标移动
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 显示圆点
            if (cursorDot.style.opacity === '0') {
                cursorDot.style.opacity = '1';
            }
            
            // 标记鼠标正在移动，清除之前的定时器
            isMouseMoving = true;
            clearTimeout(timeoutId);
            
            // 设置定时器，当鼠标停止移动 100ms 后标记停止
            timeoutId = setTimeout(() => {
                isMouseMoving = false;
            }, 100);
        });

        // 鼠标离开页面时隐藏圆点
        document.addEventListener('mouseleave', () => {
            cursorDot.style.opacity = '0';
        });

        // 鼠标进入页面时显示圆点（如果之前隐藏了）
        document.addEventListener('mouseenter', () => {
            if (mouseX !== 0 || mouseY !== 0) {
                cursorDot.style.opacity = '1';
            }
        });

        // 动画循环：让圆点平滑跟随
        function animateDot() {
            // 计算与目标位置的差值
            const diffX = mouseX - dotX;
            const diffY = mouseY - dotY;
            
            // 根据鼠标是否移动调整跟随速度
            if (isMouseMoving) {
                // 移动时：快速跟随（但保留一点延迟感）
                dotX += diffX * 0.15;
                dotY += diffY * 0.15;
            } else {
                // 停止时：缓慢回到指针位置
                dotX += diffX * 0.1;
                dotY += diffY * 0.1;
            }
            
            // 应用位置
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            
            requestAnimationFrame(animateDot);
        }

        // 启动动画循环
        animateDot();

                // 创建肽类警告可折叠组件（纯DOM方式）
        var peptideWarningWidget = document.createElement('div');
        peptideWarningWidget.id = 'peptide-warning-widget';
        peptideWarningWidget.className = 'fixed bottom-24 right-6 z-50';
        
        // ========== 公告系统 ==========
        // 公告数据 - 新增公告直接加在数组最前面，自动保留最新3条
        var announcements = [];

        // 从 data/announcements.json 加载公告（由后台 admin.html 维护）
        async function loadAnnouncements() {
            try {
                var res = await fetch('data/announcements.json?ts=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                var items = (data && data.items) ? data.items : [];
                announcements = items.filter(function (a) { return a.visible !== false; })
                    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
            } catch (e) {
                announcements = [];
                console.warn('公告数据加载失败：', e);
            }
        }

        // 加载成分数据（外部 JSON，仅取 visible，按 order 排序）
        async function loadIngredients() {
            try {
                var res = await fetch('data/ingredients.json?ts=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var items = await res.json();
                if (!Array.isArray(items)) throw new Error('成分数据格式不正确');
                ingredientsData = items.filter(function (it) { return it.visible !== false; })
                    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
            } catch (e) {
                ingredientsData = [];
                console.warn('成分数据加载失败：', e);
            }
        }

        // 加载违规词指南（外部 JSON）
        async function loadViolation() {
            try {
                var res = await fetch('data/violation.json?ts=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                complianceGuide = await res.json();
                if (!complianceGuide || !complianceGuide.sections)
                    throw new Error('违规词数据格式不正确');
            } catch (e) {
                complianceGuide = null;
                console.warn('违规词数据加载失败：', e);
            }
        }

        // 渲染公告
        function renderAnnouncements() {
            var listEl = document.getElementById('announcement-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            
            for (var i = 0; i < announcements.length; i++) {
                var ann = announcements[i];
                var annIcon = ann.icon || (ann.type === 'danger' ? 'fa-exclamation-triangle'
                    : (ann.type === 'warning' ? 'fa-exclamation-circle' : 'fa-info-circle'));
                var isFirst = i === 0;
                
                // 根据类型设置颜色
                var bgColor, borderColor, textColor, iconColor;
                if (ann.type === 'danger') {
                    bgColor = 'bg-red-50';
                    borderColor = 'border-red-200';
                    textColor = 'text-red-700';
                    iconColor = 'text-red-500';
                } else if (ann.type === 'warning') {
                    bgColor = 'bg-yellow-50';
                    borderColor = 'border-yellow-200';
                    textColor = 'text-yellow-700';
                    iconColor = 'text-yellow-500';
                } else {
                    bgColor = 'bg-blue-50';
                    borderColor = 'border-blue-200';
                    textColor = 'text-blue-700';
                    iconColor = 'text-blue-500';
                }
                
                // 创建公告容器
                var annDiv = document.createElement('div');
                annDiv.className = 'mb-3 rounded-lg border ' + borderColor + ' ' + bgColor;
                annDiv.id = 'announcement-' + ann.id;
                
                // 创建标题按钮
                var toggleBtn = document.createElement('button');
                toggleBtn.className = 'w-full py-2.5 px-4 flex items-center justify-between transition-all hover:bg-opacity-80';
                toggleBtn.innerHTML = 
                    '<div class="flex items-center gap-2">' +
                        '<i class="fa ' + annIcon + ' ' + iconColor + ' text-lg"></i>' +
                        '<span class="text-sm font-semibold ' + textColor + '">' + ann.title + '</span>' +
                        (ann.date ? '<span class="text-xs ' + textColor + ' opacity-70 ml-2">' + ann.date + '</span>' : '') +
                    '</div>' +
                    '<i class="fa fa-chevron-down text-xs transition-transform duration-300 ' + textColor + '" id="ann-arrow-' + ann.id + '"></i>';
                
                // 创建内容面板
                var contentDiv = document.createElement('div');
                contentDiv.className = 'px-4 pb-4 text-sm ' + textColor + ' hidden';
                contentDiv.id = 'ann-content-' + ann.id;
                contentDiv.innerHTML = ann.content;
                
                // 绑定点击事件
                (function(contentId, arrowId) {
                    toggleBtn.addEventListener('click', function() {
                        var content = document.getElementById(contentId);
                        var arrow = document.getElementById(arrowId);
                        if (content.classList.contains('hidden')) {
                            content.classList.remove('hidden');
                            if (arrow) arrow.style.transform = 'rotate(180deg)';
                        } else {
                            content.classList.add('hidden');
                            if (arrow) arrow.style.transform = 'rotate(0deg)';
                        }
                    });
                })('ann-content-' + ann.id, 'ann-arrow-' + ann.id);
                
                annDiv.appendChild(toggleBtn);
                annDiv.appendChild(contentDiv);
                listEl.appendChild(annDiv);
            }
        }
        
        // 给肽类成分卡片加警告标识
        function addPeptideBadges() {
            var cards = document.querySelectorAll('.ingredient-card');
            for (var i = 0; i < cards.length; i++) {
                var card = cards[i];
                // 删除旧标识
                var oldBadge = card.querySelector('.peptide-badge');
                if (oldBadge) oldBadge.remove();
                
                // 获取成分名称
                var nameEl = card.querySelector('h3');
                if (!nameEl) continue;
                var name = nameEl.textContent || '';
                
                // 只给名称含"肽"或"胜肽"的成分加标识
                if (name.indexOf('肽') !== -1 || name.indexOf('胜肽') !== -1) {
                    var badge = document.createElement('div');
                    badge.className = 'peptide-badge absolute top-2 right-2 z-30';
                    badge.innerHTML = '<i class="fa fa-exclamation-triangle text-red-500 text-xl" title="肽类成分高危管控"></i>';
                    card.style.position = 'relative';
                    card.appendChild(badge);
                }
            }
        }
        
        // 控制公告显示隐藏
        function updateAnnouncementVisibility() {
            var widget = document.getElementById('announcement-widget');
            if (!widget) return;
            if (currentCategory === '违规词参考') {
                widget.classList.add('hidden');
            } else {
                widget.classList.remove('hidden');
                setTimeout(addPeptideBadges, 100);
            }
        }
        
        // 包装原filterIngredients函数
        var originalFilterAnnouncement = filterIngredients;
        filterIngredients = function() {
            originalFilterAnnouncement.apply(this, arguments);
            updateAnnouncementVisibility();
        };
        
        // 初始化页面：先加载可编辑数据，再默认进入“违规词参考”
        (async function () {
            await loadAnnouncements();
            await loadIngredients();
            await loadViolation();
            cgBuildCapsules();
            mergedIngredientsData = mergeIngredientsData(ingredientsData);
            handleCategoryFilter('违规词参考');
            renderAnnouncements();
            updateAnnouncementVisibility();
            setTimeout(addPeptideBadges, 200);
        })();
        
        // 绑定导航栏气泡按钮事件（需要等DOM加载完成）
        setTimeout(() => {
            const ignoreBtn = document.getElementById('ignoreNavTipBtn');
            const goBtn = document.getElementById('goToSourceNavBtn');
            const bubble = document.getElementById('prohibitedTipBubble');
            
            if (ignoreBtn) {
                ignoreBtn.addEventListener('click', function() {
                    if (bubble) bubble.classList.add('hidden');
                });
            }
            if (goBtn) {
                goBtn.addEventListener('click', function() {
                    window.open('https://seller.kuajingmaihuo.com/questionnaire?surveyId=19802919030', '_blank', 'noopener,noreferrer');
                });
            }
        }, 100);
    </script>

</body></html>
