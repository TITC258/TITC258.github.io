<html lang="zh-CN">
<head>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        
                // 深色模式初始化
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                if (icon) icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }
            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                if (icon) {
                    icon.classList.toggle('fa-moon-o', !isDark);
                    icon.classList.toggle('fa-sun-o', isDark);
                }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }
        
        // 退场动画跳转
        let isExiting = false;
        function pageExitAndGoHome(url) {
            if (isExiting) return;
            isExiting = true;
            document.body.classList.add('page-exit');
            document.body.classList.add('exit-bg');
            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }
        
        // 页面加载时初始化深色模式、绑定返回按钮、清理退场残留
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            
            // 重新绑定深色切换按钮（解决视觉不刷新）
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.onclick = null;
                themeToggle.addEventListener('click', () => {
                    const isDark = document.body.classList.toggle('dark');
                    const icon = themeToggle.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-moon-o', !isDark);
                        icon.classList.toggle('fa-sun-o', isDark);
                    }
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');

                    // 定义浅色和深色模式下的渐变起始色（与您之前 CSS 变量中的值一致）
                    const lightColors = {
                        basic: '#297eff',
                        antiaging: '#8b3eff',
                        bright: '#EC4899',
                        soothe: '#10B981',
                        antiox: '#6366F1',
                        default: '#6B7280'
                    };
                    const darkColors = {
                        basic: '#1e3a5f',
                        antiaging: '#4a1d6b',
                        bright: '#8b2c5e',
                        soothe: '#1f6e4a',
                        antiox: '#3c3f8a',
                        default: '#3f3f4e'
                    };
                    const colors = isDark ? darkColors : lightColors;

                    // 更新所有卡片的渐变层
                    const cards = document.querySelectorAll('.ingredient-card');
                    cards.forEach(card => {
                        const gradientLayer = card.querySelector('.gradient-layer');
                        if (!gradientLayer) return;
                        const key = card.getAttribute('data-category-key');
                        const color = colors[key] || colors.default;
                        gradientLayer.style.background = `linear-gradient(to bottom, ${color} 0%, transparent 100%)`;
                    });
                });
            }
            
            // 绑定返回按钮
            const backHomeBtn = document.getElementById('backHomeBtn');
            if (backHomeBtn) {
                backHomeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    pageExitAndGoHome('index.html');
                });
            }
            
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        
        // 从其他页面返回时也清理（pageshow 不需要重复绑定按钮）
        window.addEventListener('pageshow', () => {
            document.body.classList.remove('page-exit', 'exit-bg');
            isExiting = false;
        });
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#EC4899',
                        accent: '#8B5CF6',
                        neutral: '#6B7280',
                        'neutral-light': '#F3F4F6',
                        'neutral-dark': '#374151',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

                    <div class="flex rounded-lg overflow-hidden border border-gray-200">
                        <button id="tab-prohibited" class="px-4 py-2 text-sm font-medium transition-colors  + '' + ">违规词</button>
                        <button id="tab-allowed" class="px-4 py-2 text-sm font-medium transition-colors  + '' + ">可用词</button>
                    </div>
                </div>
            ;
            wrapper.innerHTML = headerHtml;
            ingredientsContainer.appendChild(wrapper);

            // 根据当前标签筛选数据
            const filteredData = data.filter(cat => {
                if (currentProhibitedTab === 'prohibited') {
                    return cat.category.startsWith('🚫');
                } else {
                    return cat.category.startsWith('✅');
                }
            });

            filteredData.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-8';
                
                const title = document.createElement('h3');
                title.className = 'text-lg font-semibold text-primary mb-3 pb-1 border-b border-gray-200';
                title.textContent = category.category;
                categoryDiv.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 lg:grid-cols-2 gap-4';

                category.items.forEach(item => {
                    const enDiv = document.createElement('div');
                    enDiv.className = 'text-gray-700';
                    enDiv.textContent = item.en;
                    const zhDiv = document.createElement('div');
                    zhDiv.className = 'text-gray-700';
                    zhDiv.textContent = item.zh;
                    grid.appendChild(enDiv);
                    grid.appendChild(zhDiv);
                });

                categoryDiv.appendChild(grid);
                wrapper.appendChild(categoryDiv);
            });

            // 绑定切换事件
            const tabProhibited = document.getElementById('tab-prohibited');
            const tabAllowed = document.getElementById('tab-allowed');
            if (tabProhibited) {
                tabProhibited.addEventListener('click', () => {
                    currentProhibitedTab = 'prohibited';
                    filterIngredients();
                });
            }
            if (tabAllowed) {
                tabAllowed.addEventListener('click', () => {
                    currentProhibitedTab = 'allowed';
                    filterIngredients();
                });
            }
        }

        // 过滤违规词数据
        function filterProhibitedWords(data, searchTerm) {
            if (!searchTerm) return data; // 无搜索词时返回原数据

            const lowerTerm = searchTerm.toLowerCase();
            const filtered = [];

            data.forEach(category => {
                const filteredItems = category.items.filter(item => 
                    item.en.toLowerCase().includes(lowerTerm) || 
                    item.zh.includes(lowerTerm) // 中文直接包含即可
                );
                if (filteredItems.length > 0) {
                    filtered.push({
                        category: category.category,
                        items: filteredItems
                    });
                }
            });

            return filtered;
        }

        // 渲染游戏列表
        function renderGames(games) {
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.className = 'flex flex-col gap-4 w-full';
            
            const quickNav = document.getElementById('quick-nav');
            if (quickNav) quickNav.innerHTML = '';
            
            if (games.length === 0) {
                ingredientsContainer.innerHTML = `
                    <div class="text-center py-12 w-full">
                        <i class="fa fa-gamepad text-4xl text-gray-400 mb-4"></i>
                        <p class="text-lg text-gray-500">暂无游戏，敬请期待</p>
                    </div>
                `;
                return;
            }
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-soft hover:shadow-hover transition-all-300 p-6 flex flex-col md:flex-row items-start gap-5 w-full';
                card.innerHTML = `
                    <div class="flex-shrink-0 w-16 h-16 rounded-2xl bg-gradient-to-br ${game.color} flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="fa ${game.icon}"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${game.name}</h3>
                        <p class="text-gray-600 mb-4">${game.description}</p>
                        <button class="play-game-btn inline-flex items-center gap-2 bg-gradient-to-r ${game.color} text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-md hover:shadow-lg transition-all duration-200 transform hover:scale-105" data-game-url="${game.file}">
                            <i class="fa fa-play"></i>
                            <span>开始游戏</span>
                            <i class="fa fa-external-link ml-1 text-xs opacity-75"></i>
                        </button>
                    </div>
                `;
                ingredientsContainer.appendChild(card);
            });
            
            // 绑定开始游戏按钮事件
            document.querySelectorAll('.play-game-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const url = this.dataset.gameUrl;
                    window.open(url, '_blank', 'noopener,noreferrer');
                });
            });
        }

        // 筛选成分
        function filterIngredients() {
            // 违规词参考分类保持不变
            if (currentCategory === '违规词参考') {
                let filteredData = prohibitedWordsDetailed;
                if (currentSearchTerm) {
                    filteredData = filterProhibitedWords(prohibitedWordsDetailed, currentSearchTerm);
                }
                renderProhibitedWords(filteredData);
                return;
            }
            
            if (currentCategory === 'game') {
                renderGames(gamesData);
                return;
            }
            
            // 使用合并后的数据
            let filtered = mergedIngredientsData;
            
            // 如果不是“全部”，按大类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(ingredient => ingredient.category === currentCategory);
            }
            
            // 按搜索词筛选（支持名称、英文名、学名）
            if (currentSearchTerm) {
                const searchLower = currentSearchTerm.toLowerCase();
                filtered = filtered.filter(ingredient => 
                    ingredient.name.toLowerCase().includes(searchLower) || 
                    (ingredient.englishName && ingredient.englishName.toLowerCase().includes(searchLower)) || 
                    (ingredient.scientificName && ingredient.scientificName.toLowerCase().includes(searchLower))
                );
            }
            
            // 根据当前分类决定渲染方式
            if (currentCategory === 'all') {
                // 全部成分页面：使用多列布局，卡片带子类标签
                renderIngredients(filtered);
            } else {
                // 大类页面：按子类分组渲染
                renderCategoryPage(filtered, currentCategory);
            }
        }

        // 搜索功能
        function handleSearch() {
            currentSearchTerm = searchInput.value.trim();
            filterIngredients();
        }

        // 分类筛选功能
        function handleCategoryFilter(category) {
            currentCategory = category;
            
            categoryButtons.forEach(btn => {
                const isActive = btn.dataset.category === category;
                // 移除所有可能的状态类
                btn.classList.remove('bg-gradient-primary', 'text-white', 'bg-white', 'text-neutral-dark');
                
                if (isActive) {
                    // 激活状态：默认用 primary 渐变，游戏按钮用紫色渐变以示区分
                    if (category === 'game') {
                        btn.classList.add('bg-gradient-to-r', 'from-purple-500', 'to-purple-600', 'text-white');
                    } else {
                        btn.classList.add('bg-gradient-primary', 'text-white');
                    }
                } else {
                    btn.classList.add('bg-white', 'text-neutral-dark');
                }
            });
            
            // 控制导航栏气泡显示/隐藏
            const navTipBubble = document.getElementById('prohibitedTipBubble');
            if (navTipBubble) {
                if (category === '违规词参考') {
                    navTipBubble.classList.remove('hidden');
                } else {
                    navTipBubble.classList.add('hidden');
                }
            }
            
            filterIngredients();
        }

        // ========== 搜索框展开/收起逻辑 ==========
        const searchContainer = document.getElementById('search-container');

        // 检查搜索框是否已展开
        function isSearchExpanded() {
            return searchInput.classList.contains('w-64') || searchInput.classList.contains('w-full');
        }

        // 展开搜索框
        function expandSearch() {
            searchInput.classList.remove('w-0', 'opacity-0');
            searchInput.classList.add('opacity-100', 'px-4');
            if (window.innerWidth < 768) {
                searchInput.classList.add('w-full');
                searchInput.classList.remove('w-64');
            } else {
                searchInput.classList.add('w-64');
                searchInput.classList.remove('w-full');
            }
            searchButton.classList.add('hidden'); // 隐藏放大镜按钮
            searchInput.focus();
        }

        // 收起搜索框（仅当内容为空时）
        function collapseSearch() {
            if (searchInput.value.trim() === '') {
                // 先收起搜索框
                searchInput.classList.remove('w-64', 'w-full', 'opacity-100', 'px-4');
                searchInput.classList.add('w-0', 'opacity-0');
                
                // 添加延迟，等搜索框完全收回收起后再显示放大镜按钮
                setTimeout(() => {
                    searchButton.classList.remove('hidden'); // 显示放大镜按钮
                }, 300); // 延迟时间与 CSS transition 时间一致
            }
        }

        // 自定义搜索按钮点击事件
        searchButton.addEventListener('click', function(e) {
            e.preventDefault();
            if (!isSearchExpanded()) {
                expandSearch();
            } else {
                // 已展开则执行搜索
                handleSearch();
            }
        });

        // 输入框失去焦点时尝试收起
        searchInput.addEventListener('blur', function() {
            collapseSearch();
        });

        // 实时搜索：输入内容变化立即筛选
        searchInput.addEventListener('input', function() {
            currentSearchTerm = searchInput.value.trim();
            filterIngredients();
        });

        // 窗口大小变化时调整展开宽度
        window.addEventListener('resize', function() {
            if (isSearchExpanded()) {
                if (window.innerWidth < 768) {
                    searchInput.classList.remove('w-64');
                    searchInput.classList.add('w-full');
                } else {
                    searchInput.classList.remove('w-full');
                    searchInput.classList.add('w-64');
                }
            }
        });
        // ========== 结束 ==========

        // 事件监听
        // searchButton.addEventListener('click', handleSearch); // 注释掉原有事件，使用新的展开/收起逻辑
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                handleCategoryFilter(btn.dataset.category);
            });
        });

        // 窗口大小变化时重新渲染（防抖处理）
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                filterIngredients(); // 重新触发筛选，自动重新布局
            }, 200);
        });

        // 返回顶部按钮功能
        const backToTop = document.getElementById('back-to-top');

        // 监听滚动事件，显示/隐藏按钮
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) { // 滚动超过300px时显示
                backToTop.classList.remove('opacity-0', 'invisible');
                backToTop.classList.add('opacity-100', 'visible');
            } else {
                backToTop.classList.add('opacity-0', 'invisible');
                backToTop.classList.remove('opacity-100', 'visible');
            }
        });

        // 点击按钮平滑滚动到顶部
        backToTop.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // 跟随鼠标的小圆点
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;
        let isMouseMoving = false;
        let timeoutId;

        // 监听鼠标移动
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 显示圆点
            if (cursorDot.style.opacity === '0') {
                cursorDot.style.opacity = '1';
            }
            
            // 标记鼠标正在移动，清除之前的定时器
            isMouseMoving = true;
            clearTimeout(timeoutId);
            
            // 设置定时器，当鼠标停止移动 100ms 后标记停止
            timeoutId = setTimeout(() => {
                isMouseMoving = false;
            }, 100);
        });

        // 鼠标离开页面时隐藏圆点
        document.addEventListener('mouseleave', () => {
            cursorDot.style.opacity = '0';
        });

        // 鼠标进入页面时显示圆点（如果之前隐藏了）
        document.addEventListener('mouseenter', () => {
            if (mouseX !== 0 || mouseY !== 0) {
                cursorDot.style.opacity = '1';
            }
        });

        // 动画循环：让圆点平滑跟随
        function animateDot() {
            // 计算与目标位置的差值
            const diffX = mouseX - dotX;
            const diffY = mouseY - dotY;
            
            // 根据鼠标是否移动调整跟随速度
            if (isMouseMoving) {
                // 移动时：快速跟随（但保留一点延迟感）
                dotX += diffX * 0.15;
                dotY += diffY * 0.15;
            } else {
                // 停止时：缓慢回到指针位置
                dotX += diffX * 0.1;
                dotY += diffY * 0.1;
            }
            
            // 应用位置
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            
            requestAnimationFrame(animateDot);
        }

        // 启动动画循环
        animateDot();

        // 初始化页面
        renderIngredients(mergedIngredientsData);
        
        // 绑定导航栏气泡按钮事件（需要等DOM加载完成）
        setTimeout(() => {
            const ignoreBtn = document.getElementById('ignoreNavTipBtn');
            const goBtn = document.getElementById('goToSourceNavBtn');
            const bubble = document.getElementById('prohibitedTipBubble');
            
            if (ignoreBtn) {
                ignoreBtn.addEventListener('click', function() {
                    if (bubble) bubble.classList.add('hidden');
                });
            }
            if (goBtn) {
                goBtn.addEventListener('click', function() {
                    window.open('https://seller.kuajingmaihuo.com/questionnaire?surveyId=19802919030', '_blank', 'noopener,noreferrer');
                });
            }
        }, 100);
    </script>
